[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-rework"
version = "1.1.3"
description = "osu!mania 4K Rework 谱面分析卡片 NoneBot2 插件"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[websockets]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "aiohttp>=3.9",
    "playwright>=1.40",
    "pillow>=10.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["nonebot_plugin_rework*"]

[tool.setuptools.package-data]
nonebot_plugin_rework = ["tosu_plugin/**/*", "tosu_plugin/*"]

[tool.nonebot]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]
plugins = ["nonebot_plugin_rework"]
plugin_dirs = ["."]
